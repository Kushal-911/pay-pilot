openapi: 3.0.3
info:
  title: PayPilot API
  version: 0.1.0
  description: PayPal checkout, payment evidence, and investigation API.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Check API and database readiness
      description: The process responds only after database configuration; 503 means the database ping failed.
      responses:
        '200': { description: Database is reachable, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [ok] } } } } } }
        '503': { description: Database unavailable, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [unavailable] } } } } } }
  /api/v1/orders:
    post:
      summary: Create an internal order
      description: Repeating the same Idempotency-Key and request replays the original response. A key reused with a different request conflicts.
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchant_reference, amount_minor, currency, description]
              properties:
                merchant_reference: { type: string, maxLength: 120 }
                amount_minor: { type: integer, format: int64, minimum: 1 }
                currency: { type: string, minLength: 3, maxLength: 3 }
                description: { type: string, maxLength: 255 }
      responses:
        '201': { description: Order created }
        '400': { description: Invalid order or idempotency key }
        '409': { description: Idempotency conflict/in-progress or merchant reference conflict }
        '500': { description: Database or idempotency storage error }
    get:
      summary: List recent orders
      responses:
        '200': { description: Up to 100 orders }
        '500': { description: Database error }
  /api/v1/orders/{id}:
    get:
      summary: Get an order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Order }
        '404': { description: Not found }
        '500': { description: Database error }
  /api/v1/orders/{id}/payments:
    get:
      summary: List payment attempts for an order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Payment attempts }
        '404': { description: Order not found }
        '500': { description: Database error }
  /api/v1/orders/{id}/events:
    get:
      summary: List sanitized PayPal events for an order
      description: Returns only events correlated to this merchant order, oldest first. The response excludes raw webhook payloads, signature headers, and secrets. Duplicate deliveries appear once; processing status exposes failed or delayed reconciliation.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Order-scoped events, or an empty array when none are stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderEvent' }
        '404': { description: Order not found }
        '500': { description: Database error }
  /api/v1/orders/{id}/paypal-order:
    post:
      summary: Create a PayPal Sandbox checkout order
      description: Requires configured PayPal Sandbox credentials and return/cancel URLs. Uses the Idempotency-Key replay and conflict policy.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      responses:
        '201': { description: PayPal order and approval URL }
        '400': { description: Invalid idempotency key }
        '404': { description: Merchant order not found }
        '409': { description: Order state or idempotency conflict }
        '500': { description: Database or idempotency storage error }
        '502': { description: PayPal provider error }
        '503': { description: PayPal checkout configuration is missing }
  /api/v1/payments/{id}/capture:
    post:
      summary: Capture an approved PayPal order server side
      description: Capture is a separate action after buyer approval. An ambiguous provider outcome is stored as unknown; refresh provider state before any retry. Idempotency-Key replays the same request response.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      responses:
        '200': { description: Verified completed capture }
        '400': { description: Invalid idempotency key }
        '404': { description: Payment attempt not found }
        '409': { description: Invalid state, amount/currency mismatch, or idempotency conflict }
        '500': { description: Database or idempotency storage error }
        '502': { description: Provider error or incomplete/ambiguous capture; refresh before retrying }
  /api/v1/payments/{id}/refresh:
    get:
      summary: Refresh authoritative PayPal order state
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Refreshed provider state }
        '404': { description: Payment attempt not found }
        '502': { description: Provider state could not be refreshed }
        '500': { description: Database error }
  /api/v1/orders/{id}/investigations:
    get:
      summary: List investigations for an order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Recent investigations }
        '400': { description: Invalid order UUID }
        '500': { description: Database error }
  /api/v1/investigations:
    post:
      summary: Investigate an order using persisted evidence
      description: Read-only investigation. Model output is accepted only when report fields and evidence references validate; otherwise a deterministic report is persisted. Idempotency-Key replays the original request response.
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, question]
              properties:
                order_id: { type: string, format: uuid }
                question: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '201': { description: Persisted investigation with validated evidence references }
        '400': { description: Invalid request or idempotency key }
        '409': { description: Idempotency key conflict or request already in progress }
        '404': { description: Order not found }
        '500': { description: Evidence or persistence error }
  /api/v1/investigations/{id}:
    get:
      summary: Retrieve a persisted investigation and its evidence
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Investigation report }
        '400': { description: Invalid investigation UUID }
        '404': { description: Investigation not found }
        '500': { description: Database error }
  /api/v1/webhooks/paypal:
    post:
      summary: Verify, deduplicate, and reconcile a PayPal webhook
      description: Requires PayPal transmission headers and configured PAYPAL_WEBHOOK_ID. Only verified events are persisted.
      parameters:
        - { in: header, name: paypal-auth-algo, required: true, schema: { type: string } }
        - { in: header, name: paypal-cert-url, required: true, schema: { type: string, format: uri } }
        - { in: header, name: paypal-transmission-id, required: true, schema: { type: string } }
        - { in: header, name: paypal-transmission-sig, required: true, schema: { type: string } }
        - { in: header, name: paypal-transmission-time, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id, event_type, resource] }
      responses:
        '200': { description: Verified event accepted or duplicate delivery acknowledged }
        '400': { description: Invalid event body or provider identifiers }
        '401': { description: Signature invalid or required headers missing }
        '413': { description: Webhook body exceeds 1 MiB }
        '500': { description: Verified event could not be persisted }
        '502': { description: PayPal signature verification unavailable }
        '503': { description: Webhook verification is not configured }
components:
  schemas:
    ProviderEvent:
      type: object
      required: [id, provider_event_id, event_type, processing_status, received_at]
      properties:
        id: { type: string, format: uuid }
        provider_event_id: { type: string }
        event_type: { type: string }
        paypal_order_id: { type: string, nullable: true }
        paypal_capture_id: { type: string, nullable: true }
        resource_status: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        processing_status: { type: string, enum: [received, processed, failed] }
        received_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }
